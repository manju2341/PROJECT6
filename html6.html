<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css6.css">
</head>
<body>
    <div class="container">
        <h1>Text Manipulator</h1>

        <input type="text" id="textInput" value="Hello World!" placeholder="Type your text here...">
        
        <div class="display-box" id="displayText">Hello World!</div>

        <div class="controls">
        <button id="uppercaseBtn">UPPERCASE</button>
        <button id="lowercaseBtn">lowercase</button>
        <button id="captial">Capitalize</button>

        <button id="redtxt">Red Text</button>
        <button id="bluetxt">Blue Text</button>
        <button id="greentxt">Green Text</button>

        <button id="Biggerfont">Bigger Font</button> 
        <button id="Smallerfont">Smaller Font</button>

        <button id="Reset">Reset</button>
        </div>
    </div>
    <script src="js6.js"></script>
</body>
</html>
